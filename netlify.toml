# Netlify: the shop and the admin. Step-by-step set-up: docs/guides/deploy-netlify.md
# Netlify's Next.js runtime is picked up by itself. Uploaded photos go to Netlify Blobs (no keys),
# and the background jobs are called by an outside cron service (see the guide, Part 2).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
